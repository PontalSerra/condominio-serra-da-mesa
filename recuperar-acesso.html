<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Recuperar acesso — Pontal da Serra</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#163e4a;background:#f2f5f5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:460px;width:100%;background:#fff;border-radius:18px;box-shadow:0 14px 42px #18384017;padding:34px}
    .brand{font-size:14px;font-weight:800;letter-spacing:.08em;color:#278082;text-transform:uppercase}
    h1{font-size:28px;margin:12px 0 12px;line-height:1.18}
    p{line-height:1.55;color:#52686e;font-size:14px}label{display:block;font-weight:700;font-size:13px;margin-top:19px;margin-bottom:7px}
    input{width:100%;padding:12px 13px;font-size:16px;border:1px solid #bdd0d1;border-radius:9px;background:white}
    input:focus{outline:2px solid #2b8582;outline-offset:1px}
    button{width:100%;font:700 15px system-ui;margin-top:22px;padding:13px;background:#12424e;color:white;border:0;border-radius:9px;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}
    .note{margin-top:18px;border-radius:10px;padding:13px;font-size:14px;background:#e8f5ef;color:#245b42}
    .note.error{background:#fff0f0;color:#9d3434}a{color:#155a6d;font-weight:700}small{color:#677b80}
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <main class="card">
    <div class="brand">Pontal da Serra Web</div>
    <h1>Recuperar acesso</h1>
    <p id="help">Informe seu e-mail cadastrado para receber um novo link de recuperação.</p>
    <form id="request-form" class="hidden">
      <label for="email">E-mail cadastrado</label><input type="email" id="email" autocomplete="username" required>
      <button id="send" type="submit">Enviar link de recuperação</button>
    </form>
    <form id="reset-form" class="hidden">
      <label for="password">Nova senha (mínimo de 12 caracteres)</label><input type="password" id="password" autocomplete="new-password" minlength="12" required>
      <label for="confirm">Confirme a nova senha</label><input type="password" id="confirm" autocomplete="new-password" minlength="12" required>
      <button id="save" type="submit">Salvar nova senha</button>
    </form>
    <div id="feedback" class="note hidden" role="status" aria-live="polite"></div>
    <p><a href="./">← Voltar ao aplicativo</a></p>
    <small>Nunca informe sua senha a outras pessoas. A recuperação é feita diretamente pelo serviço de autenticação do Supabase.</small>
  </main>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const feedback = (text,error=false) => { $('feedback').textContent=text; $('feedback').className='note'+(error?' error':''); };
    const showRequest=()=>{ $('request-form').classList.remove('hidden');$('reset-form').classList.add('hidden');$('help').textContent='Informe seu e-mail cadastrado para receber um novo link de recuperação.'; };
    const showReset=()=>{ $('request-form').classList.add('hidden');$('reset-form').classList.remove('hidden');$('help').textContent='Confirme sua nova senha para concluir a recuperação.'; };
    const config=window.PONTAL_CONFIG || {};
    if(!config.supabaseUrl || !config.supabaseAnonKey){ feedback('Configuração do Supabase ausente. Entre em contato com o administrador.',true); throw Error('config missing'); }
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const supabase=createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
    const url=new URL(location.href), hash=new URLSearchParams(location.hash.slice(1));
    const hasRecoveryParams=url.searchParams.has('code') || hash.get('type')==='recovery' || hash.has('access_token');
    const errorText=url.searchParams.get('error_description') || hash.get('error_description');
    if(errorText){feedback('Este link é inválido ou expirou. Solicite outro abaixo.',true);showRequest();}
    else if(hasRecoveryParams){
      $('help').textContent='Verificando o link de recuperação...';
      const {data,error}=await supabase.auth.getSession();
      if(error || !data?.session){feedback('O link não foi validado. Solicite outro abaixo.',true);showRequest();}
      else showReset();
    } else showRequest();
    supabase.auth.onAuthStateChange((event,session)=>{
      if(event==='PASSWORD_RECOVERY' && session && !errorText)showReset();
    });
    $('request-form').addEventListener('submit',async(event)=>{
      event.preventDefault();const btn=$('send');btn.disabled=true;
      try{
        const destination=new URL('./recuperar-acesso.html',location.href).toString();
        const {error}=await supabase.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:destination});
        if(error)throw error;
        feedback('Se o e-mail estiver cadastrado, você receberá um novo link. Abra apenas a mensagem mais recente.');
      }catch(e){feedback('Não foi possível enviar o link: '+(e.message||'erro de conexão'),true);}
      finally{btn.disabled=false;}
    });
    $('reset-form').addEventListener('submit',async(event)=>{
      event.preventDefault();const pass=$('password').value;
      if(pass.length<12)return feedback('A senha precisa ter pelo menos 12 caracteres.',true);
      if(pass!==$('confirm').value)return feedback('As duas senhas não coincidem.',true);
      const btn=$('save');btn.disabled=true;
      try{
        const {error}=await supabase.auth.updateUser({password:pass});
        if(error)throw error;
        feedback('Senha alterada com sucesso. Volte ao aplicativo e entre com seu e-mail e a nova senha.');
        $('reset-form').classList.add('hidden');
        await supabase.auth.signOut();
        history.replaceState(null,'','./recuperar-acesso.html');
      }catch(e){feedback('Não foi possível alterar a senha: '+(e.message||'erro inesperado'),true);}
      finally{btn.disabled=false;}
    });
  </script>
</body>
</html>
